<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrillPyze simulator</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/plotly.min.js"></script>
</head>
<body>
<div class="app">

  <!-- ===================================================== case panel -->
  <aside class="case" id="case" aria-label="Case inputs">
    <header class="case-head">
      <div>
        <h1>DrillPyze</h1>
        <p class="case-name" id="case-name">Well A</p>
      </div>
      <button class="icon-btn" id="collapse-case" aria-label="Hide inputs" title="Hide inputs">‹</button>
    </header>

    <div class="case-scroll" id="form">
      <!-- sections are generated by app.js -->
    </div>

    <footer class="case-foot">
      <button class="btn primary" id="apply">Apply and reset</button>
      <div class="file-row">
        <button class="btn quiet" id="restore">Load Well A</button>
        <button class="btn quiet" id="save-case">Save case</button>
        <label class="btn quiet file">Open case<input type="file" id="open-case" accept=".json,application/json"></label>
      </div>
      <p class="hint" id="dirty-hint" hidden>Inputs changed. Apply to restart the simulation with them.</p>
    </footer>
  </aside>

  <!-- ===================================================== workspace -->
  <main class="work">

    <section class="transport" aria-label="Simulation controls">
      <button class="icon-btn show-case" id="show-case" aria-label="Show inputs" title="Show inputs" hidden>›</button>

      <div class="group play">
        <button class="btn play-btn" id="play" aria-label="Play">Play</button>
        <button class="btn" id="step" title="Advance one frame">Step</button>
        <button class="btn quiet" id="reset" title="Restart from the initial state">Reset</button>
      </div>

      <div class="group clock">
        <span class="clock-time" id="clock">0.00 s</span>
        <span class="clock-sub" id="speed-out">ready</span>
      </div>

      <div class="group pacing">
        <label>Frame
          <select id="frame-dt">
            <option value="0.05">0.05 s</option>
            <option value="0.1" selected>0.1 s</option>
            <option value="0.25">0.25 s</option>
            <option value="0.5">0.5 s</option>
            <option value="1">1 s</option>
            <option value="5">5 s</option>
          </select>
        </label>
        <label>Speed
          <select id="speed">
            <option value="0.25">¼× real time</option>
            <option value="1" selected>Real time</option>
            <option value="2">2×</option>
            <option value="5">5×</option>
            <option value="0">As fast as possible</option>
          </select>
        </label>
        <span class="run-ahead">
          <input type="number" id="ahead" value="60" min="1" step="1" aria-label="Seconds to run ahead">
          <button class="btn quiet" id="run-ahead" title="Simulate this many seconds without animating each frame">Run ahead (s)</button>
        </span>
      </div>

      <div class="group live" aria-label="Rig inputs">
        <div class="live-row">
          <select id="td-mode" aria-label="Top drive mode">
            <option value="setpoint">Top drive set point</option>
            <option value="speed">Prescribed top drive speed</option>
          </select>
          <input type="range" id="rpm-slider" min="0" max="200" step="1" value="60" aria-label="Top drive rpm">
          <input type="number" id="rpm" value="60" step="1" class="num"><span class="unit">rpm</span>
        </div>
        <div class="live-row">
          <select id="dw-mode" aria-label="Drawworks mode">
            <option value="velocity">Block speed (+ lowering)</option>
            <option value="wob">Autodriller WOB</option>
          </select>
          <input type="range" id="dw-slider" min="-60" max="60" step="0.5" value="0" aria-label="Drawworks input">
          <input type="number" id="dw" value="0" step="0.5" class="num"><span class="unit" id="dw-unit">m/h</span>
        </div>
      </div>
    </section>

    <p class="message" id="message" role="status" hidden></p>

    <section class="readouts" aria-label="Current values">
      <div class="ro rot"><span class="ro-label">Top drive</span><span class="ro-val" id="ro-rpm-td">–</span><span class="ro-unit">rpm</span></div>
      <div class="ro rot"><span class="ro-label">Bit</span><span class="ro-val" id="ro-rpm-bit">–</span><span class="ro-unit">rpm</span></div>
      <div class="ro trq"><span class="ro-label">Surface torque</span><span class="ro-val" id="ro-tq">–</span><span class="ro-unit">kN·m</span></div>
      <div class="ro trq"><span class="ro-label">Torque on bit</span><span class="ro-val" id="ro-tob">–</span><span class="ro-unit">kN·m</span></div>
      <div class="ro ax"><span class="ro-label">Hookload</span><span class="ro-val" id="ro-hk">–</span><span class="ro-unit">kN</span></div>
      <div class="ro ax"><span class="ro-label">WOB</span><span class="ro-val" id="ro-wob">–</span><span class="ro-unit">kN</span></div>
      <div class="ro ax"><span class="ro-label">ROP</span><span class="ro-val" id="ro-rop">–</span><span class="ro-unit">m/h</span></div>
      <div class="ro"><span class="ro-label">Bit depth</span><span class="ro-val" id="ro-depth">–</span><span class="ro-unit">m</span></div>
    </section>

    <section class="string-views" aria-label="Along-string state">
      <div class="plot" id="p-path"></div>
      <div class="plot" id="p-rpm"></div>
      <div class="plot" id="p-torque"></div>
      <div class="plot" id="p-tension"></div>
    </section>

    <section class="scrub" aria-label="Replay">
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Replay position">
      <span id="scrub-label">Live</span>
      <button class="btn quiet" id="go-live" hidden>Back to live</button>
    </section>

    <section class="traces" aria-label="Time history">
      <div class="trace-head">
        <span>Time history</span>
        <div class="seg" role="radiogroup" aria-label="Time window" id="window">
          <button role="radio" data-w="60" aria-checked="true">60 s</button>
          <button role="radio" data-w="600" aria-checked="false">10 min</button>
          <button role="radio" data-w="3600" aria-checked="false">60 min</button>
          <button role="radio" data-w="0" aria-checked="false">All</button>
        </div>
        <a class="btn quiet" id="download" href="#" download>Download results (CSV)</a>
      </div>
      <div class="plot trace" id="t-rpm"></div>
      <div class="plot trace" id="t-torque"></div>
      <div class="plot trace" id="t-axial"></div>
    </section>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
