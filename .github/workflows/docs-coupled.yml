# Build the Sphinx documentation of the coupled model and publish it to the
# coupled-model/ folder of the gh-pages branch:
#   https://<owner>.github.io/<repo>/coupled-model/
name: Coupled-model documentation

on:
  push:
    branches: [coupled-model]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs-coupled.yml'
  workflow_dispatch:

permissions:
  contents: write          # push to the gh-pages branch

concurrency:
  group: docs-coupled
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . sphinx sphinx-rtd-theme myst-parser
      - name: Build (warnings are errors)
        run: sphinx-build -W --keep-going -d "$RUNNER_TEMP/doctrees" -b html docs/source docs/build   # doctrees kept out of the site
      - name: Publish to gh-pages/coupled-model
        # retries when another workflow pushed to gh-pages first
        run: .github/scripts/publish-pages.sh docs/build coupled-model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
