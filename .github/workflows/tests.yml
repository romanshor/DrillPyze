name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:      # run by hand from the Actions tab or `gh workflow run tests.yml`

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v5          # runs the browser engine for tests/test_lite_engine.py
        with:
          node-version: 22
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -q

  # One check named "Tests" for branch protection to require: it passes only when every
  # pytest job above passed, so the rule keeps working if the Python matrix changes.
  tests:
    name: Tests
    if: always()
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs passed
        run: test "${{ needs.pytest.result }}" = success
