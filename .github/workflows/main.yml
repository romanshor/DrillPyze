# Build the Sphinx documentation from main and publish it at the root of the
# gh-pages branch (https://<owner>.github.io/<repo>/).  Folders published by the
# other workflows (lite/, coupled-model/) are kept.
name: Generate and Publish Documentation with Sphinx

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write          # push to the gh-pages branch

concurrency:
  group: docs-main
  cancel-in-progress: true

jobs:
  doc-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . sphinx sphinx-rtd-theme myst-parser
      - name: Build (warnings are errors)
        run: sphinx-build -W --keep-going -d "$RUNNER_TEMP/doctrees" -b html docs/source docs/build   # doctrees kept out of the site
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
          keep_files: true        # keep lite/ and coupled-model/ (published by other workflows)
