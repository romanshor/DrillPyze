name: Feature Request
description: Suggest an idea for a new feature or enhancement.
title: "[Feature Request]: "
labels: ["enhancement", "feature-request"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
  - type: input
    id: feature-summary
    attributes:
      label: Feature Summary
      description: Provide a clear and concise summary of the feature you're requesting.
      placeholder: e.g., "Add dark mode to the application"
    validations:
      required: true
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Describe the problem this feature aims to solve. What pain points does it address?
      placeholder: e.g., "Users currently experience eye strain when using the application in low-light environments."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or how you envision this feature working.
      placeholder: e.g., "Implement a toggle switch in the settings to enable/disable dark mode, applying a new CSS theme."
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds? If so, please describe them and why this feature is preferred.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false